name: Release

# Releases automatically on every push to main: if no GitHub release exists for the
# version in Surf.psd1, one is created (tag + zip + generated notes) and the module
# is published to the PowerShell Gallery (when the PSGALLERY_API_KEY secret is set).
# GitHub and Gallery existence are checked independently, so a rerun can repair a
# partially completed release. Pushes that do not bump ModuleVersion normally do nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release module version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Import-PowerShellDataFile ./Surf/Surf.psd1).ModuleVersion

          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "GitHub release v$version already exists - skipping its creation."
          } else {
            Write-Host "Creating GitHub release v$version"
            ./build.ps1
            gh release create "v$version" "dist/Surf-$version.zip" --title "v$version" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }

          $galleryRelease = Find-PSResource -Name Surf -Version $version -Repository PSGallery -ErrorAction SilentlyContinue
          if ($galleryRelease) {
            Write-Host "Surf $version already exists in the PowerShell Gallery - skipping publication."
            exit 0
          }

          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is not set.' }

          Publish-PSResource -Path ./Surf -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
          Write-Host "Published Surf $version to the PowerShell Gallery."
