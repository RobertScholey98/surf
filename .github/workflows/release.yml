name: Release

# Releases automatically on every push to main: if no GitHub release exists for the
# version in Surf.psd1, one is created (tag + zip + generated notes) and the module
# is published to the PowerShell Gallery (when the PSGALLERY_API_KEY secret is set).
# Pushes that don't bump ModuleVersion do nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release if ModuleVersion is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $version = (Import-PowerShellDataFile ./Surf/Surf.psd1).ModuleVersion

          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$version already exists - nothing to do."
            exit 0
          }

          Write-Host "Creating release v$version"
          ./build.ps1

          gh release create "v$version" "dist/Surf-$version.zip" --title "v$version" --generate-notes
          if ($LASTEXITCODE -ne 0) { Write-Error 'gh release create failed'; exit 1 }

          if ($env:PSGALLERY_API_KEY) {
            Publish-Module -Path ./Surf -NuGetApiKey $env:PSGALLERY_API_KEY
            Write-Host 'Published to the PowerShell Gallery.'
          } else {
            Write-Host 'PSGALLERY_API_KEY secret not set - skipping Gallery publish.'
          }
